<div class="aurora" aria-hidden="true"></div>
<div class="gridlines" aria-hidden="true"></div>

<header class="topbar" id="topbar">
  <div class="wrap">
    <a class="brand" href="./" data-langlink><img src="assets/icon.png" alt="">
      <span class="name">One<b>Sound</b></span></a>
    <nav class="links">
      <a href="#play" data-i18n="navPlay"></a>
      <a href="#features" data-i18n="navFeatures"></a>
      <a href="#gallery" data-i18n="navGallery"></a>
      <a href="#download" data-i18n="navDownload"></a>

      <button type="button" data-lang="vi">VI</button>
      <button type="button" data-lang="ko">한국어</button>

  </div>
</header>

          <div><strong data-count="2000">0</strong><span data-i18n="statSongs"></span></div>

          <div><strong>3</strong><span data-i18n="statLangs"></span></div>

      <div class="showcase reveal d2" aria-hidden="true">
        <div class="spot"></div>
        <div class="stack" id="stack">
          <div class="poster p2"><img src="assets/promo/friends-1.webp" alt=""></div>
          <div class="poster p3"><img src="assets/promo/chat-2.webp" alt=""></div>
          <div class="poster p1"><img src="assets/promo/guess-2.webp" alt=""></div>
        </div>
        <div class="float-chip c1"><span class="dot">✋</span>

          <span><span data-i18n="chip2"></span><small>+150 XP</small></span></div>
      </div>
    </div>
  </section>

  <!-- ---------------------------------------------------------- ticker -->
  <div class="ticker" aria-hidden="true"><div class="track" id="ticker"></div></div>

  <!-- ----------------------------------------------------- how it plays -->
  <section class="round" id="play">
    <div class="wrap">
      <div>
        <div class="head reveal">
          <span class="eyebrow" data-i18n="howEyebrow"></span>
          <h2 data-i18n="howTitle"></h2>
          <p data-i18n="howLead"></p>
        </div>
        <ol class="steps">
          <li class="reveal" data-step="0"><h3 data-i18n="s1t"></h3><p data-i18n="s1p"></p></li>
          <li class="reveal d1" data-step="1"><h3 data-i18n="s2t"></h3><p data-i18n="s2p"></p></li>
          <li class="reveal d2" data-step="2"><h3 data-i18n="s3t"></h3><p data-i18n="s3p"></p></li>
          <li class="reveal d3" data-step="3"><h3 data-i18n="s4t"></h3><p data-i18n="s4p"></p></li>
        </ol>
      </div>
      <div class="demo reveal from-right" aria-hidden="true">
        <div class="demo-top"><span class="live"><i></i>LIVE</span>
          <span data-i18n="demoRound"></span></div>
        <div class="wave" id="wave"></div>
        <div class="timer"><i id="timerBar"></i></div>
        <div class="players"><span>E</span><span id="me">Y</span><span>L</span><span>M</span></div>
        <div class="guess"><span id="typed"></span><span class="caret"></span></div>
        <div class="result" id="result"><b data-i18n="correct"></b><span>+150 · 1.8s</span></div>
      </div>
    </div>
  </section>

  <!-- -------------------------------------------------------- features -->
  <section id="features">
    <div class="wrap">
      <div class="head center reveal">
        <span class="eyebrow" data-i18n="featEyebrow"></span>
        <h2 data-i18n="featTitle"></h2>
        <p data-i18n="featLead"></p>
      </div>

      <div class="feature">
        <div class="art reveal from-left" style="--glow: rgba(62,166,255,.45)">
          <div class="poster"><img src="assets/promo/guess-1.webp" alt="" loading="lazy"></div></div>
        <div class="reveal d1">
          <div class="num">01</div>
          <h3 data-i18n="f1t"></h3><p data-i18n="f1p"></p>
          <ul class="ticks"><li data-i18n="f1a"></li><li data-i18n="f1b"></li><li data-i18n="f1c"></li></ul>
        </div>
      </div>

          <div class="num">04</div>

        </div>
      </div>
    </div>
  </section>

  <!-- --------------------------------------------------------- gallery -->
  <section id="gallery" style="padding-top:20px">
    <div class="wrap">
      <div class="head center reveal">
        <span class="eyebrow" data-i18n="galEyebrow"></span>
        <h2 data-i18n="galTitle"></h2>
      </div>
    </div>

  <!-- ------------------------------------------------------------- end -->

    <div class="wrap">
      <div class="final reveal">
        <img src="assets/promo/banner.webp" alt="OneSound" loading="lazy">

        <div class="copy">
          <div>
            <span class="eyebrow" data-i18n="ctaEyebrow"></span>
            <h2 style="margin-top:14px" data-i18n="ctaTitle"></h2>

  </section>
</main>
