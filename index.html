<title>OneSound: Live Music Battles</title>
<meta name="description" content="Hear the song, raise your hand first and name it. OneSound is a live music-guessing game to play with friends.">
<meta name="theme-color" content="#060b18">
<meta property="og:title" content="OneSound: Live Music Battles">
<meta property="og:description" content="Hear the song, raise your hand first and name it.">

<meta property="og:type" content="website">

<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<div class="orbs" aria-hidden="true"><span></span><span></span><span></span></div>
<div class="grain" aria-hidden="true"></div>

<header class="topbar">
  <div class="wrap">
    <a class="brand" href="./"><img src="assets/icon.png" alt="">

    <div class="lang" role="group" aria-label="Language">

      <button type="button" data-lang="ko">한국어</button>
    </div>
  </div>
</header>

<main>
  <!-- ------------------------------------------------------------ hero -->
  <section class="hero">
    <div class="wrap">
      <div>
        <span class="eyebrow reveal"><i></i><span data-i18n="eyebrow"></span></span>

          <span class="glow" data-i18n="h1b"></span></h1>
        <p class="lead reveal d2" data-i18n="lead"></p>
        <div class="stores reveal d3">
          <a class="store" href="#download">
            <svg viewBox="0 0 24 24" fill="none"><path d="M4 3.5v17l9-8.5-9-8.5Z" fill="#22d3ee"/><path d="m13 12 3-2.9L5.2 3l7.8 9Z" fill="#3ea6ff"/><path d="m13 12-7.8 9L16 14.9 13 12Z" fill="#8b5cf6"/><path d="m16 9.1 3.6 2a1 1 0 0 1 0 1.8l-3.6 2L13 12l3-2.9Z" fill="#ffc940"/></svg>

          <div><strong data-count="17">0</strong><span data-i18n="statPacks"></span></div>
          <div><strong>3</strong><span data-i18n="statLangs"></span></div>
        </div>
      </div>

        <div class="halo"></div>
        <div class="ring"></div><div class="ring r2"></div><div class="ring r3"></div>

      </div>
    </div>
  </section>

  <!-- ----------------------------------------------------- how it plays -->
  <section class="round">
    <div class="wrap">
      <div>
        <div class="section-head reveal" style="text-align:left;margin:0 0 28px">
          <span class="eyebrow" data-i18n="howEyebrow"></span>
          <h2 data-i18n="howTitle"></h2>
          <p data-i18n="howLead"></p>
        </div>
        <ol class="steps">
          <li class="reveal" data-step="0"><b>🎧</b><div><h3 data-i18n="s1t"></h3><p data-i18n="s1p"></p></div></li>
          <li class="reveal d1" data-step="1"><b>✋</b><div><h3 data-i18n="s2t"></h3><p data-i18n="s2p"></p></div></li>
          <li class="reveal d2" data-step="2"><b>⌨️</b><div><h3 data-i18n="s3t"></h3><p data-i18n="s3p"></p></div></li>
          <li class="reveal d3" data-step="3"><b>🏆</b><div><h3 data-i18n="s4t"></h3><p data-i18n="s4p"></p></div></li>
        </ol>
      </div>
      <div class="demo reveal" aria-hidden="true">
        <div class="demo-top"><span class="live"><i></i>LIVE</span>
          <span data-i18n="demoRound"></span></div>
        <div class="disc"></div>
        <div class="timer"><i id="timerBar"></i></div>
        <div class="players"><span>E</span><span id="me">Y</span><span>L</span><span>M</span></div>
        <div class="guess"><span id="typed"></span><span class="caret"></span></div>
        <div class="result" id="result"><span data-i18n="correct"></span>
          <span class="points">+150</span></div>
      </div>
    </div>
  </section>

  <!-- --------------------------------------------------------- features -->
  <section>
    <div class="wrap">
      <div class="section-head reveal">
        <span class="eyebrow" data-i18n="featEyebrow"></span>
        <h2 data-i18n="featTitle"></h2>
      </div>
      <div class="grid">
        <div class="card reveal"><div class="ico">⚡</div><h3 data-i18n="f1t"></h3><p data-i18n="f1p"></p></div>
        <div class="card reveal d1"><div class="ico">🎙️</div><h3 data-i18n="f2t"></h3><p data-i18n="f2p"></p></div>
        <div class="card reveal d2"><div class="ico">👥</div><h3 data-i18n="f3t"></h3><p data-i18n="f3p"></p></div>
        <div class="card reveal"><div class="ico">🏅</div><h3 data-i18n="f4t"></h3><p data-i18n="f4p"></p></div>
        <div class="card reveal d1"><div class="ico">🔥</div><h3 data-i18n="f5t"></h3><p data-i18n="f5p"></p></div>

      <h2 data-i18n="packsTitle"></h2>
      <p data-i18n="packsLead"></p>
    </div>
    <div class="marquee reveal"><div class="track" id="packsA"></div></div>
    <div class="marquee rev reveal"><div class="track" id="packsB"></div></div>
  </section>

  <!-- ------------------------------------------------------ screenshots -->
  <section>
    <div class="wrap">
      <div class="section-head reveal">
        <span class="eyebrow" data-i18n="shotsEyebrow"></span>
        <h2 data-i18n="shotsTitle"></h2>
      </div>

        <div class="phone"><img src="assets/player.jpg" alt="" loading="lazy"></div>
        <div class="phone"><img src="assets/leaderboard.jpg" alt="" loading="lazy"></div>
      </div>
    </div>
  </section>

  <!-- -------------------------------------------------------------- CTA -->
  <section id="download">
    <div class="wrap">
      <div class="cta reveal">
        <h2 data-i18n="ctaTitle"></h2>
        <p data-i18n="ctaLead"></p>
        <div class="flags"><span>🇬🇧 English</span><span>🇻🇳 Tiếng Việt</span><span>🇰🇷 한국어</span></div>

</main>
