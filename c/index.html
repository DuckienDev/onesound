<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OneSound Challenge</title>
<meta name="description" content="A friend challenged you on OneSound: same songs, one try. Open it in the app.">
<meta property="og:site_name" content="OneSound">
<meta property="og:title" content="You've been challenged on OneSound">
<meta property="og:description" content="Same songs, one try. Can you beat your friend's score?">
<meta property="og:image" content="https://duckiendev.github.io/onesound/assets/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://duckiendev.github.io/onesound/assets/og.jpg">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#060b18">
<link rel="icon" href="../assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Urbanist:wght@800&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700;900&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/site.css">
<style>
  /* The challenge page: one ticket with the code, one button. */
  .challenge { min-height: calc(100svh - 70px); display: grid; place-items: center; padding-block: 24px 60px; }
  .ticket { width: 100%; max-width: 460px; text-align: center; }
  .ticket h1 { font: 800 clamp(44px, 12vw, 64px)/.95 var(--display); margin: 0 0 12px; letter-spacing: .01em; }
  .ticket .lead { color: var(--sub); margin: 0 auto 28px; max-width: 34ch; }
  .code { display: flex; justify-content: center; gap: 8px; margin: 0 0 30px; }
  .code span {
    width: 48px; height: 60px; display: grid; place-items: center;
    background: var(--deck); border: 1px solid var(--line); border-radius: 14px;
    font: 800 30px/1 var(--display); color: var(--text);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .05);
  }
  .open-btn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; height: 52px; border-radius: 26px; border: 0; cursor: pointer;
    background: linear-gradient(135deg, #3ea6ff, #2f6dff); color: #fff;
    font: 700 17px/1 var(--body);
    box-shadow: 0 10px 30px rgba(62, 166, 255, .38), inset 0 1px 0 rgba(255, 255, 255, .25);
    transition: transform .15s;
  }
  .open-btn:active { transform: scale(.98); }
  .howto { margin: 30px 0 0; padding: 20px 22px; background: var(--deck); border: 1px solid var(--line); border-radius: 18px; text-align: left; }
  .howto h2 { font: 600 15px/1.3 var(--body); color: var(--text); margin: 0 0 10px; }
  .howto ol { margin: 0; padding-left: 20px; color: var(--sub); font-size: 15px; }
  .howto li + li { margin-top: 6px; }
  .howto a { color: var(--ice); text-decoration: underline; text-underline-offset: 3px; }
  .bad { color: var(--sub); }
  @media (max-width: 380px) { .code span { width: 42px; height: 54px; font-size: 26px; } .code { gap: 6px; } }
</style>
</head>
<body>
<header class="topbar" id="topbar">
  <div class="wrap">
    <a class="brand" href="../" data-langlink aria-label="OneSound"><span class="wm" aria-hidden="true"><i style="--n:0">O</i><i style="--n:1">n</i><i style="--n:2">e</i><i style="--n:3" class=s>S</i><i style="--n:4" class=s>o</i><i style="--n:5" class=s>u</i><i style="--n:6" class=s>n</i><i style="--n:7" class=s>d</i></span></a>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="en">EN</button>
      <button type="button" data-lang="vi">VI</button>
      <button type="button" data-lang="ko">한국어</button>
      <button type="button" data-lang="zh">中文</button>
    </div>
  </div>
</header>
<main class="challenge">
  <div class="wrap">
    <div class="ticket" id="ticket">
      <h1 data-t="title">You've been challenged</h1>
      <p class="lead" data-t="lead">Same songs, one try. Beat your friend's score.</p>
      <div class="code" id="code" aria-label="Challenge code"></div>
      <a class="open-btn" id="open" href="#" data-t="open">Open in OneSound</a>
      <div class="howto">
        <h2 data-t="noApp">Don't have OneSound yet?</h2>
        <ol>
          <li><a href="https://github.com/DuckienDev/onesound/releases/latest/download/OneSound-android.apk" download data-t="step1">Download it for Android</a></li>
          <li data-t="step2">Open the app and tap Join Room.</li>
          <li data-t="step3">Enter the code above.</li>
        </ol>
      </div>
    </div>
  </div>
</main>
<script>
/* Challenge links: ?code=ABC123 → the app as onesound://open/c/ABC123.
   On Android an intent:// link falls back to this page (with noapp=1) when
   the app is missing, so the code and download stay on screen. */
(function () {
  var T = {
    en: { title: "You've been challenged", lead: "Same songs, one try. Beat your friend's score.", open: 'Open in OneSound', noApp: "Don't have OneSound yet?", step1: 'Download it for Android', step2: 'Open the app and tap Join Room.', step3: 'Enter the code above.', bad: 'This challenge link is missing its code. Ask your friend to send it again.' },
    vi: { title: 'Bạn được thách đấu', lead: 'Cùng bài hát, một lượt chơi. Vượt qua điểm của bạn mình nhé.', open: 'Mở bằng OneSound', noApp: 'Chưa có OneSound?', step1: 'Tải về cho Android', step2: 'Mở app và chọn Vào phòng.', step3: 'Nhập mã ở trên.', bad: 'Link thách đấu này thiếu mã. Nhờ bạn của bạn gửi lại nhé.' },
    ko: { title: '도전장이 왔어요', lead: '같은 노래, 기회는 한 번. 친구의 점수를 넘어 보세요.', open: 'OneSound에서 열기', noApp: '아직 OneSound가 없나요?', step1: 'Android용 다운로드', step2: '앱을 열고 방 참가를 누르세요.', step3: '위의 코드를 입력하세요.', bad: '도전 링크에 코드가 없어요. 친구에게 다시 보내 달라고 하세요.' },
    zh: { title: '你收到了一个挑战', lead: '同样的歌曲，只有一次机会。超越好友的分数吧。', open: '在 OneSound 中打开', noApp: '还没有 OneSound？', step1: '下载 Android 版', step2: '打开应用，点击加入房间。', step3: '输入上方的挑战码。', bad: '这个挑战链接缺少挑战码。请好友重新发送。' }
  };
  var LANGS = ['en', 'vi', 'ko', 'zh'];
  var params = new URLSearchParams(location.search);
  var raw = (params.get('code') || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  var code = raw.length === 6 ? raw : null;

  function pickLang() {
    var p = params.get('lang');
    if (LANGS.indexOf(p) >= 0) return p;
    try { var s = localStorage.getItem('onesound.lang'); if (LANGS.indexOf(s) >= 0) return s; } catch (e) {}
    var n = (navigator.language || 'en').slice(0, 2);
    return LANGS.indexOf(n) >= 0 ? n : 'en';
  }
  function apply(lang) {
    var t = T[lang];
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-t]').forEach(function (el) { el.textContent = t[el.dataset.t]; });
    if (!code) document.querySelector('.lead').textContent = t.bad;
    document.querySelectorAll('.lang button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.lang === lang)); });
    document.querySelectorAll('[data-langlink]').forEach(function (a) { a.setAttribute('href', '../?lang=' + lang); });
  }
  document.querySelectorAll('.lang button').forEach(function (b) {
    b.addEventListener('click', function () {
      try { localStorage.setItem('onesound.lang', b.dataset.lang); } catch (e) {}
      apply(b.dataset.lang);
    });
  });
  apply(pickLang());

  var box = document.getElementById('code');
  var open = document.getElementById('open');
  if (!code) { box.style.display = 'none'; open.style.display = 'none'; return; }
  code.split('').forEach(function (c) { var s = document.createElement('span'); s.textContent = c; box.appendChild(s); });

  var app = 'onesound://open/c/' + code;
  var android = /Android/i.test(navigator.userAgent);
  if (android) {
    var back = location.origin + location.pathname + '?code=' + code + '&noapp=1';
    open.href = 'intent://open/c/' + code + '#Intent;scheme=onesound;package=com.onesound.dy;' +
      'S.browser_fallback_url=' + encodeURIComponent(back) + ';end';
  } else {
    open.href = app;
  }
  // Straight into the app once; coming back from a missing app stays here.
  if (!params.get('noapp')) {
    setTimeout(function () { location.href = open.href; }, 350);
  }

  var bar = document.getElementById('topbar');
  addEventListener('scroll', function () { bar.classList.toggle('scrolled', scrollY > 10); }, { passive: true });
})();
</script>
</body>
</html>
